<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">


<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Intellectra (Futuristic Approach)</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto" id="navbar"></ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="card shadow-lg rounded-4 border-0 profile-card mx-auto">
    <div class="card-body text-center p-5">
      <img src="./Intellectra.png" class="rounded-circle mb-3 border profile-img" alt="profile">
      <h2 class="fw-bold mb-2" id="userName"></h2>
      <p class="text-muted mb-1">📧 <span id="userEmail"></span></p>
      <p class="fst-italic" id="userAbout"></p>
      <div class="d-flex justify-content-center gap-2 mt-4">
        <button class="btn btn-danger px-4" onclick="deleteAccount()">Delete Account</button>
        <button class="btn btn-secondary px-4" onclick="logoutUser()">Logout</button>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
