<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="container my-5">

  <div id="navbar" class="mb-4"></div>

  <div class="card text-center p-4 shadow">
    <div class="card-body">
      <h3 id="userName"></h3>
      <p><strong>Email:</strong> <span id="userEmail"></span></p>
      <p><strong>Username:</strong> <span id="userUsername"></span></p>
      <p><strong>About Me:</strong> <span id="userAbout"></span></p>

      <button class="btn btn-warning me-2" onclick="logout()">Logout</button>
      <button class="btn btn-danger" onclick="deleteAccount()">Delete My Account</button>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
